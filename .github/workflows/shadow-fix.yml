name: Shadow Fix

on:
  issues:
    types: [labeled]

jobs:
  respond:
    if: github.event.label.name == 'shadow-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🤖 **Shadow Engineer** received the `shadow-fix` label and is starting to investigate this issue."
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Apply candidate fix
        run: python apply_fix.py

      - name: Run tests to verify the fix
        run: pytest -v

      - name: Open pull request with verified fix
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Fix divide() to raise ValueError on division by zero"
          title: "Shadow Engineer: verified fix for divide-by-zero bug"
          body: "This fix was applied and verified by running the full test suite before this PR was opened. All tests passed."
          branch: shadow-fix/divide-by-zero
