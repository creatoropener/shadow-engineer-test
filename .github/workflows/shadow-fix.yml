name: Shadow Fix

on:
  issues:
    types: [labeled]

concurrency:
  group: shadow-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify-and-open-pr:
    if: github.event.label.name == 'shadow-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      CONTREE_IMAGE: ${{ secrets.CONTREE_IMAGE }}
      CONTREE_IMAGE_PYTHON_PYTEST: ${{ secrets.CONTREE_IMAGE_PYTHON_PYTEST }}
      CONTREE_IMAGE_NODE_PACKAGE: ${{ secrets.CONTREE_IMAGE_NODE_PACKAGE }}
      CONTREE_IMAGE_STATIC_WEB: ${{ secrets.CONTREE_IMAGE_STATIC_WEB }}
      CONTREE_IMAGE_WEB_PLAYWRIGHT: ${{ secrets.CONTREE_IMAGE_WEB_PLAYWRIGHT }}
      CONTREE_IMAGE_JAVA_JUNIT: ${{ secrets.CONTREE_IMAGE_JAVA_JUNIT }}
      CONTREE_IMAGE_JAVA_MAVEN: ${{ secrets.CONTREE_IMAGE_JAVA_MAVEN }}
      CONTREE_IMAGE_JAVA_GRADLE: ${{ secrets.CONTREE_IMAGE_JAVA_GRADLE }}
      CONTREE_IMAGE_GO: ${{ secrets.CONTREE_IMAGE_GO }}
      CONTREE_IMAGE_RUST: ${{ secrets.CONTREE_IMAGE_RUST }}
      NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL || secrets.NEBIUS_MODEL }}

    steps:
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🤖 **Shadow Engineer** received the `shadow-fix` label. PatchProof is generating an independent regression test and evaluating isolated candidate repairs."
            });

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-patchproof.txt

      - name: Install PatchProof dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-patchproof.txt

      - name: Validate configuration
        shell: bash
        run: |
          missing=0
          for name in NEBIUS_PROJECT_ID NEBIUS_API_KEY NEBIUS_MODEL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name."
              missing=1
            fi
          done
          if [[ -z "$CONTREE_IMAGE" && -z "$CONTREE_IMAGE_PYTHON_PYTEST" && \
                -z "$CONTREE_IMAGE_NODE_PACKAGE" && -z "$CONTREE_IMAGE_STATIC_WEB" && \
                -z "$CONTREE_IMAGE_WEB_PLAYWRIGHT" && -z "$CONTREE_IMAGE_JAVA_JUNIT" && \
                -z "$CONTREE_IMAGE_JAVA_MAVEN" && -z "$CONTREE_IMAGE_JAVA_GRADLE" && \
                -z "$CONTREE_IMAGE_GO" && -z "$CONTREE_IMAGE_RUST" ]]; then
            echo "::error::Add CONTREE_IMAGE or at least one runtime-specific image secret."
            missing=1
          fi
          exit "$missing"

      - name: Run PatchProof verification
        id: patchproof
        continue-on-error: true
        run: python proof.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchproof-issue-${{ github.event.issue.number }}
          path: |
            proof.json
            verification-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          if [[ -f verification-report.md ]]; then
            cat verification-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open pull request with verified fix
        if: steps.patchproof.outcome == 'success'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "PatchProof: verified repair for issue #${{ github.event.issue.number }}"
          title: "Shadow Engineer: verified repair for #${{ github.event.issue.number }}"
          body-path: verification-report.md
          branch: shadow-fix/issue-${{ github.event.issue.number }}
          delete-branch: true

      - name: Comment with verified pull request
        if: steps.patchproof.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verification-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **PatchProof verified a repair.**\n\nPull request: ${process.env.PR_URL}\n\n${report}`
            });

      - name: Comment when verification rejects all repairs
        if: steps.patchproof.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('verification-report.md')
              ? fs.readFileSync('verification-report.md', 'utf8')
              : 'PatchProof stopped before producing a report. Check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **PatchProof rejected the attempted repair.**\n\n${report}`
            });

      - name: Enforce PatchProof verdict
        if: steps.patchproof.outcome == 'failure'
        run: exit 1
