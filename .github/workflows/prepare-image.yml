name: Prepare Sandbox Image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Toolchain profile (all supplies the shared CONTREE_IMAGE)
        required: true
        default: all
        type: choice
        options: [all, python, web, jvm, go, rust]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
      CONTREE_BASE_URL: https://api.tokenfactory.nebius.com/sandboxes
      IMAGE_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Contree SDK
        run: python -m pip install --disable-pip-version-check contree-sdk==0.3.6

      - name: Validate Sandbox credentials
        shell: bash
        run: |
          if [[ -z "$NEBIUS_API_KEY" || -z "$NEBIUS_PROJECT_ID" ]]; then
            echo "::error::Add NEBIUS_API_KEY and NEBIUS_PROJECT_ID in repository Actions secrets."
            exit 1
          fi
          echo "Using Nebius IAM authentication."

      - name: Import base image and install multi-runtime toolchain
        run: |
          python3 << 'EOF'
          import os
          import sys

          from contree_sdk import ContreeSync
          from contree_sdk.auth import IAMAuth
          from contree_sdk.config import ContreeConfig
          from contree_sdk.sdk.exceptions.api import ForbiddenError

          base_url = os.environ["CONTREE_BASE_URL"]

          auth = IAMAuth(
              token=os.environ["NEBIUS_API_KEY"].strip(),
              project_id=os.environ["NEBIUS_PROJECT_ID"].strip(),
              base_url=base_url,
          )

          sdk = ContreeSync(ContreeConfig(
              auth=auth,
              transport_timeout=30,
              operation_import_timeout=900,
              operation_run_timeout=2700,
              operation_timeout=3000,
          ))

          try:
              # Resolve one image first so authentication and project access fail
              # before a potentially long OCI import starts.
              sdk.images(number=1)
              print("Sandbox access preflight passed with IAM auth.")

              base = sdk.images.oci(
                  "docker://docker.io/library/python:3.12-slim-trixie"
              )
              profile = os.environ["IMAGE_PROFILE"]
              if profile not in {"all", "python", "web", "jvm", "go", "rust"}:
                  raise SystemExit("Unknown image profile")
              install = ["set -eux", "apt-get update",
                         "apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libssl-dev",
                         "python -m pip install --disable-pip-version-check pytest==8.3.5"]
              if profile in {"all", "web"}:
                  install += [
                      "apt-get install -y --no-install-recommends nodejs npm",
                      "npm install --prefix /opt/patchproof/node --ignore-scripts --no-audit --no-fund jsdom@24.1.3",
                      "python -m pip install playwright==1.55.0 Pillow==11.3.0 zxing-cpp==2.3.0",
                      "PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install --with-deps chromium",
                      "node --version && npm --version",
                      "node -e \"require('/opt/patchproof/node/node_modules/jsdom')\"",
                  ]
              if profile in {"all", "jvm"}:
                  install += [
                      "apt-get install -y --no-install-recommends default-jdk-headless maven",
                      "mkdir -p /opt/patchproof/java",
                      "curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar -o /opt/patchproof/java/junit-platform-console-standalone.jar",
                      "java -version && javac -version && mvn --version",
                  ]
              if profile in {"all", "go"}:
                  install += ["apt-get install -y --no-install-recommends golang-go", "go version"]
              if profile in {"all", "rust"}:
                  install += ["apt-get install -y --no-install-recommends cargo rustc", "cargo --version && rustc --version"]
              install += ["apt-get clean", "python -m pytest --version"]
              ready = base.run(
                  shell="\n".join(install),
                  tag=f"patchproof-{profile}:v0.5",
                  timeout=2700,
                  disposable=False,
              ).wait()
          except ForbiddenError:
              print(
                  "::error::Nebius Sandbox returned 403 Forbidden. Confirm that "
                  "NEBIUS_API_KEY belongs to NEBIUS_PROJECT_ID and that this "
                  "project has Sandbox beta access.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if ready.exit_code != 0 or ready.uuid is None:
              print("::error::Sandbox image preparation failed.", file=sys.stderr)
              print(ready.stderr, file=sys.stderr)
              raise SystemExit(1)

          print("IMAGE_UUID:", ready.uuid)
          print("IMAGE_TAG:", ready.tag)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"image_uuid={ready.uuid}", file=output)
              print(f"image_tag={ready.tag}", file=output)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("## PatchProof sandbox image prepared", file=summary)
              print(f"- UUID: `{ready.uuid}`", file=summary)
              print(f"- Tag: `{ready.tag}`", file=summary)
              names = {
                  "all": ["CONTREE_IMAGE"],
                  "python": ["CONTREE_IMAGE_PYTHON_PYTEST"],
                  "web": ["CONTREE_IMAGE_NODE_PACKAGE", "CONTREE_IMAGE_STATIC_WEB", "CONTREE_IMAGE_WEB_PLAYWRIGHT"],
                  "jvm": ["CONTREE_IMAGE_JAVA_JUNIT", "CONTREE_IMAGE_JAVA_MAVEN", "CONTREE_IMAGE_JAVA_GRADLE"],
                  "go": ["CONTREE_IMAGE_GO"], "rust": ["CONTREE_IMAGE_RUST"],
              }
              print("Save this UUID as: " + ", ".join(f"`{name}`" for name in names[profile]), file=summary)
          EOF
